name: Build macOS Executable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build .app bundle
        run: pyinstaller --windowed --name EhprojTool ehproj_tool.py

      - name: Verify build output
        run: ls -la dist/

      - name: Zip .app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/EhprojTool.app EhprojTool-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EhprojTool-macOS
          path: EhprojTool-macOS.zip
